<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto com Firebase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Catálogo de Produtos</h1>
        <p>Dados carregados em tempo real do Cloud Firestore</p>
    </header>

    <main>
        <section class="formulario-container">
            <h2>Cadastrar Novo Produto</h2>
            <form id="form-cadastro">
                <div class="campo">
                    <label for="nome">Nome do Produto:</label>
                    <input type="text" id="nome" required placeholder="Ex: Mouse Gamer">
                </div>
                <div class="campo">
                    <label for="preco">Preço (R$):</label>
                    <input type="number" id="preco" step="0.01" required placeholder="Ex: 150.00">
                </div>
                <button type="submit">Salvar Produto</button>
            </form>
        </section>

        <hr>

        <div id="lista-produtos" class="container-produtos">
            <p class="carregando">Carregando produtos...</p>
        </div>
    </main>


    <script type="module" src="app.js"></script>
</body>
</html>
